version = 0.1
default-task = 'build:'

[[task]]
name = 'build:#'
dep = '#/chompfile.toml'
display = 'none'
validation = 'none'
run = 'chomp -c $DEP build'

[[task]]
name = 'build'
deps = [':build:deno', ':build:bun', ':build:dart']
serial = true
display = 'none'

[[task]]
name = 'test:#'
dep = '#/chompfile.toml'
serial = true
display = 'none'
run = '''
  echo "Running ${DEP} tests..."
  chomp -c $DEP test
  echo ""
  echo ""
'''

[[task]]
name = 'test'
deps = [
  ':test:deno',
  # ':test:go',
  # ':test:cpp',
  # ':test:racket',
  # ':test:rust',
  ':test:bun',
  ':test:dart',
  ':test:node',
  ':test:python',
  ':test:ruby',
  # ':test:ghc',
  # ':test:assemblyscript',
]
serial = true
display = 'none'

[[task]]
name = 'clean:#'
dep = '#/chompfile.toml'
validation = 'none'
run = 'chomp -c $DEP clean'

[[task]]
name = 'clean'
deps = ['clean:']
validation = 'none'
run = 'rm -rf build'

[[task]]
name = 'interpret:#'
dep = '#/chompfile.toml'
validation = 'none'
serial = true
run = '''
  chomp -c $DEP interpret
  echo ""
  echo ""
'''

[[task]]
name = 'execute:#'
dep = '#/chompfile.toml'
validation = 'none'
serial = true
run = '''
  chomp -c $DEP execute
  echo ""
  echo ""
'''

[[task]]
name = 'bench'
deps = [
  ':bench:native',
  ':bench:execute',
  ':bench:run',
  ':bench:compile',
  ':bench:preprocess',
]
validation = 'none'
serial = true

[[task]]
name = 'bench:native'
deps = [
  'build:ghc',
  'build:deno',
  'build:go',
  'build:cpp',
  'build:dart',
  'build:racket',
  'build:rust',
  'build:bun',
  'build:node',
]
validation = 'none'
serial = true
run = '''
  hyperfine --warmup 3\
    --export-markdown _benchmarks/native.md\
    --sort mean-time\
    './cpp/build/fact' -n watermark\
    './go/build/execute --in ./ff/example.ffb' -n go\
    './cpp/build/run ./ff/example.ff' -n cpp\
    './cpp/build/execute ./ff/example.ffb' -n 'cpp-execute'\
    './rust/build/example0' -n rust\
    './bun/build/ff-run ./ff/example.ff' -n bun\
    './node/bin/ff-run.ts ./ff/example.ff' -n node\
    'cat ./ff/example_v0.ff | ./dart/bin/dart.exe' -n dart\
    'cat ./ff/example.ff | ./python/execute.py' -n python\
    './deno/build/ff-execute ./ff/example.ffb' -n deno\
    'cat ./ff/example.ff | ./ruby/execute.rb' -n ruby\
    './racket/build/example' -n racket\
    './ghc/build/ff' -n ghc\
    'cd assemblyscript && cat ../ff/example.ff | node --no-warnings ./js/run.js' -n assemblyscript
'''
# './wolfram/example.wls' -n wolfram\

[[task]]
name = 'bench:execute'
validation = 'none'
serial = true
run = 'BENCH_OUT=_benchmarks/execute.md chomp :bench:execute:./ff/example.ffb'

[[task]]
name = 'bench:run'
validation = 'none'
serial = true
run = 'BENCH_OUT=_benchmarks/run.md chomp :bench:run:./ff/example.ff'

[[task]]
name = 'bench:compile'
validation = 'none'
serial = true
run = 'BENCH_OUT=_benchmarks/compile.md chomp :bench:compile:./ff/example.ff'

[[task]]
name = 'bench:preprocess'
validation = 'none'
serial = true
run = 'BENCH_OUT=_benchmarks/preprocess.md chomp :bench:preprocess:./ff/example.ff'

[[task]]
name = 'bench:run:#'
deps = [
  '#',
  'build:ghc',
  'build:deno',
  'build:go',
  'build:cpp',
  'build:dart',
  'build:racket',
  'build:rust',
  'build:bun',
  'build:node',
]
validation = 'none'
serial = true
run = '''
  hyperfine ${BENCH_OUT:+--export-markdown "$BENCH_OUT"} --warmup 3\
    --sort mean-time\
    "./shell/ff run --run go $MATCH" -n go\
    "./shell/ff run --run cpp $MATCH" -n cpp\
    "./shell/ff run --run bun $MATCH" -n bun\
    "./shell/ff run --run node $MATCH" -n node\
    "./shell/ff run --run deno $MATCH" -n deno\
    "./shell/ff run --run dart $MATCH" -n dart\
    "./shell/ff run --run python $MATCH" -n python\
    "./shell/ff run --run ruby $MATCH" -n ruby\
    "./shell/ff run --run racket $MATCH" -n racket
'''

[[task]]
name = 'bench:compile:#'
deps = [
  '#',
  'build:deno',
  'build:go',
  'build:racket',
  'build:bun',
  'build:node',
]
validation = 'none'
serial = true
run = '''
  hyperfine ${BENCH_OUT:+--export-markdown "$BENCH_OUT"} --warmup 3\
    --sort mean-time\
    "./shell/ff compile --compiler go $MATCH" -n go\
    "./shell/ff compile --compiler bun $MATCH" -n bun\
    "./shell/ff compile --compiler node $MATCH" -n node\
    "./shell/ff compile --compiler deno $MATCH" -n deno\
    "./shell/ff compile --compiler racket $MATCH" -n racket
'''

[[task]]
name = 'bench:execute:#'
deps = [
  '#',
  'build:deno',
  'build:go',
  'build:racket',
  'build:bun',
  'build:node',
  'build:cpp',
]
validation = 'none'
serial = true
run = '''
  TARGET="$MATCH"
  case "$TARGET" in
    *.ffb) ;;
    *)
      mkdir -p build/tmp
      TEMP_DIR=$(mktemp -d build/tmp/bench-XXXXXX)
      trap 'rm -rf "$TEMP_DIR"' EXIT
      BASE=$(basename "$TARGET")
      STEM="${BASE%.*}"
      TEMP_FFB="$TEMP_DIR/$STEM.ffb"
      echo "Compiling $TARGET to $TEMP_FFB..."
      ./shell/ff compile "$TARGET" > "$TEMP_FFB"
      TARGET="$TEMP_FFB"
      ;;
  esac

  hyperfine ${BENCH_OUT:+--export-markdown "$BENCH_OUT"} --warmup 3\
    --sort mean-time\
    "./shell/ff execute --run go $TARGET" -n go\
    "./shell/ff execute --run cpp $TARGET" -n cpp\
    "./shell/ff execute --run bun $TARGET" -n bun\
    "./shell/ff execute --run node $TARGET" -n node\
    "./shell/ff execute --run deno $TARGET" -n deno\
    "./shell/ff execute --run racket $TARGET" -n racket
'''

[[task]]
name = 'bench:preprocess:#'
deps = ['#', 'build:deno', 'build:go', 'build:bun', 'build:node']
validation = 'none'
serial = true
run = '''
  hyperfine ${BENCH_OUT:+--export-markdown "$BENCH_OUT"} --warmup 3\
    --sort mean-time\
    "./shell/ff preprocess --pp go $MATCH" -n go\
    "./shell/ff preprocess --pp bun $MATCH" -n bun\
    "./shell/ff preprocess --pp node $MATCH" -n node\
    "./shell/ff preprocess --pp deno $MATCH" -n deno
'''

[[task]]
name = 'loc'
deps = ['clean']
validation = 'none'
run = 'cloc --force-lang-def=.cloc . --quiet --md --hide-rate > loc.md'

[[task]]
name = 'uroboros'
deps = [
  'build:deno',
  'build:racket',
  'build:bun',
  'build:node',
  'build:python',
  'build:ruby',
  'build:go',
  'build:dart',
]
validation = 'none'
serial = true
run = '''
  cat ./ff/quine.ff\
    | (cat; echo -e "\n----deno----" >&2) | ./deno/build/ff-run | tee /dev/tty\
    | (cat; echo -e "\n----bun----" >&2) | ./bun/build/ff-run | tee /dev/tty\
    | (cat; echo -e "\n----node----" >&2) | ./node/bin/ff-run.ts | tee /dev/tty\
    | (cat; echo -e "\n----python----" >&2) | ./python/execute.py | tee /dev/tty\
    | (cat; echo -e "\n----ruby----" >&2) | ./ruby/execute.rb | tee /dev/tty\
    | (cat; echo -e "\n----go----" >&2) | ./go/build/run | tee /dev/tty\
    | (cat; echo -e "\n----dart----" >&2) | ./dart/bin/dart.exe | tee /dev/tty\
    | (cat; echo -e "\n----deno----" >&2) | ./deno/build/ff-run;
  echo -e "\n\n== UROBOROS ==\n\n" >&2;
'''
