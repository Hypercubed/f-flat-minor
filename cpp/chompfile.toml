version = 0.1
default-task = 'build'

extensions = ['../cmp-extension.js']

[env]
NC = '\033[0m'
BLUE = '\033[0;34m'
CHECK = 'printf "  ${GRN}OK${NC} " || printf "  ${RED}FAIL${NC} "'
RED = '\033[0;31m'
GRN = '\033[0;32m'

[[task]]
name = 'build:#'
target = './build/#'
deps = ['./#.cpp']
run = '''
  cosmoc++ $DEP -std=c++11 -isystem /usr/include -o $TARGET -O2 && \
  assimilate $TARGET
'''

[[task]]
name = 'build:run'
target = './build/run'
deps = ['./ff.cpp', './ff.h', './run.cpp']
run = '''
  cosmoc++ ./ff.cpp ./run.cpp -std=c++11 -isystem /usr/include -o $TARGET -O2 && \
  assimilate $TARGET
'''

[[task]]
name = 'build:execute'
target = './build/execute'
deps = ['./ff.cpp', './ff.h', './execute.cpp']
run = 'cosmoc++ ./ff.cpp ./execute.cpp -std=c++11 -isystem /usr/include -o $TARGET -O2 && assimilate $TARGET'

[[task]]
name = 'build'
deps = ['build:run', 'build:execute', 'build:fact']

[[task]]
name = 'release:#'
target = './build/#.com'
deps = ['./#.cpp']
run = '''
  cosmoc++ $DEP -std=c++11 -isystem /usr/include -o $TARGET -O2
'''

[[task]]
name = 'release:run'
target = './build/run.com'
deps = ['./ff.cpp', './ff.h', './run.cpp']
run = '''
  cosmoc++ ./ff.cpp ./run.cpp -std=c++11 -isystem /usr/include -o $TARGET -O2
'''

[[task]]
name = 'release:execute'
target = './build/execute.com'
deps = ['./ff.cpp', './ff.h', './execute.cpp']
run = 'cosmoc++ ./ff.cpp ./execute.cpp -std=c++11 -isystem /usr/include -o $TARGET -O2'

[[task]]
name = 'release'
deps = ['release:run', 'release:execute', 'release:fact']

[[task]]
name = 'interpret'
dep = 'build:run'
run = './build/run ../ff/example.ff'
template = 'cmp'
[task.template-options]
cmp = '../ff/example.out'

[[task]]
name = 'ffb'
dep = 'build:execute'
run = './build/execute ../ff/example.ffb'
template = 'cmp'
[task.template-options]
cmp = '../ff/example.out'

[[task]]
name = 'ffb-stdin'
dep = 'build:execute'
run = 'cat ../ff/example.ffb | ./build/execute -'
template = 'cmp'
[task.template-options]
cmp = '../ff/example.out'

[[task]]
name = 'ffb-self'
dep = 'build:execute'
run = '(cp ./build/execute /tmp/ff-self-exec && cat ../ff/example.ffb >> /tmp/ff-self-exec && /tmp/ff-self-exec; STATUS=$?; rm -f /tmp/ff-self-exec; exit $STATUS)'
template = 'cmp'
[task.template-options]
cmp = '../ff/example.out'

[[task]]
name = 'test'
deps = [
    ':build',
    ':interpret',
    ':test:out',
    ':test:tap',
    ':ffb',
    ':ffb-stdin',
    ':ffb-self'
]
serial = true
display = 'none'

[[task]]
display = 'none'
name = 'build-deno-compiler'
run = 'chomp -c ../deno/ :preprocess'

[[task]]
name = 'ff'
deps = [
  '../build/ff-preprocess/##.ff',
  'build-deno-compiler',
  'build:run'
]
target = '../ff/##.out'
serial = true
invalidation = 'always'
validation = 'none'
display = 'status-only'
run = '''
  ./build/run $DEP
'''
template = 'cmp'
[task.template-options]
cmp = '$TARGET'

[[task]]
name = 'test:out'
deps = [
  '../ff/##.out',
  'build-deno-compiler',
  'build:run'
]
serial = true
invalidation = 'always'
validation = 'none'
display = 'status-only'
run = '''
  shopt -s nullglob
  shopt -s extglob
  for i in "${DEP%.*}.ff?(p)"; do
    rel_path_no_ext="${i#../ff/}"
    rel_path_no_ext="${rel_path_no_ext%.*}"
    preprocessed_file="../build/ff-preprocess/${rel_path_no_ext}.ff"
    
    if [ -f "$preprocessed_file" ]; then
      ./build/run "$preprocessed_file" | diff --ignore-trailing-space -q - > /dev/null 2>&1 "$DEP" && ${{CHECK}};
    else
      echo "Preprocessed file not found: $preprocessed_file" && false;
    fi
  done
'''

[[task]]
name = 'test:tap'
deps = [
  'build:run'
]
serial = true
invalidation = 'always'
validation = 'none'
run = '''
  shopt -s nullglob
  shopt -s extglob
  shopt -s globstar
  prove --exec "../shell/ff-run.sh --run cpp --quiet" ../ff/**/*.test.ffp
'''

[[task]]
name = 'clean'
run = '''
  rm -rf ./build
'''

[[task]]
name = 'bench'
deps = ['build:run', 'build:fact']
validation = 'none'
serial = true
run = '''
  hyperfine --warmup 3 -N\
    './build/run ../ff/example.ff'\
    './build/fact'
'''